name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The dev tools (vitest, tsup) need Node 22.12+; the package itself supports 20.19+ (see `runtime`).
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Package contents
        run: pnpm pack --dry-run
      - if: matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  runtime:
    name: Built package on Node 20.19 (oldest supported)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Standalone pnpm bundles its own Node, so it installs fine whatever Node is on the PATH.
      - uses: pnpm/action-setup@v4
        with:
          standalone: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: node scripts/smoke.mjs

  postgres:
    name: Real Postgres server (node-postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dpdp
          POSTGRES_PASSWORD: dpdp
          POSTGRES_DB: dpdp_test
          # A server in IST, as many Indian apps run: timestamps must not shift.
          TZ: Asia/Kolkata
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dpdp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DPDP_PG_URL: postgres://dpdp:dpdp@127.0.0.1:5432/dpdp_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run test/postgres-server.test.ts test/prisma-server.test.ts

  examples:
    name: Example apps, a year-long customer journey
    needs: check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dpdp
          POSTGRES_PASSWORD: dpdp
          POSTGRES_DB: chai
          TZ: Asia/Kolkata
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dpdp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEMO_CLOCK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and pack this version
        run: pnpm build && pnpm pack --pack-destination "$RUNNER_TEMP"
      - name: Prisma + Express + Postgres (IST)
        working-directory: examples/prisma-express
        env:
          DATABASE_URL: postgresql://dpdp:dpdp@127.0.0.1:5432/chai
          PORT: "3001"
          BASE_URL: http://127.0.0.1:3001
        run: |
          npm install --no-audit --no-fund "$RUNNER_TEMP"/dpdp-kit-*.tgz
          npm run db:push
          npm run audit
          npx tsx src/server.ts > server.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null "$BASE_URL/me/consents" -H "x-user-id: x" && break; sleep 1; done
          npm run journey || { cat server.log; exit 1; }
      - name: Mongoose + Express + MongoDB
        working-directory: examples/mongoose-express
        env:
          MONGODB_URL: mongodb://127.0.0.1:27017/chai
          PORT: "3002"
          BASE_URL: http://127.0.0.1:3002
        run: |
          npm install --no-audit --no-fund "$RUNNER_TEMP"/dpdp-kit-*.tgz
          npm run audit
          npx tsx src/server.ts > server.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null "$BASE_URL/me/consents" -H "x-user-id: x" && break; sleep 1; done
          npm run journey || { cat server.log; exit 1; }

  action:
    name: GitHub Action on a sample project
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and pack this version
        run: pnpm build && pnpm pack --pack-destination "$RUNNER_TEMP"
      - name: Create a sample project that installs it, like a user's repo
        run: |
          mkdir .action-sample
          cp test/action/* .action-sample/
          cd .action-sample
          # npm init would name it after the folder, and ".action-sample" isn't a valid package name
          echo '{"name":"dpdp-action-sample","private":true,"type":"module"}' > package.json
          npm install "$RUNNER_TEMP"/dpdp-kit-*.tgz drizzle-orm@0.45.4

      - name: Matching schema passes
        id: clean
        uses: ./
        with:
          working-directory: .action-sample
          schema: schema.ts

      - name: Drifted schema fails
        id: drift
        continue-on-error: true
        uses: ./
        with:
          working-directory: .action-sample
          schema: schema-drift.ts

      - name: Check the outcomes
        env:
          CLEAN_ERRORS: ${{ steps.clean.outputs.errors }}
          DRIFT_OUTCOME: ${{ steps.drift.outcome }}
          DRIFT_ERRORS: ${{ steps.drift.outputs.errors }}
        run: |
          echo "clean errors=$CLEAN_ERRORS, drift outcome=$DRIFT_OUTCOME, drift errors=$DRIFT_ERRORS"
          test "$CLEAN_ERRORS" = "0"
          test "$DRIFT_OUTCOME" = "failure"
          test "$DRIFT_ERRORS" = "1"
